<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>STOMP WebSocket 연결</title>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.1.1/bundles/stomp.umd.min.js"></script>
    <style>
        .chat-container {
            max-width: 600px;
            margin: 20px auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .chat-messages {
            height: 400px;
            overflow-y: auto;
            border: 1px solid #eee;
            padding: 10px;
            margin-bottom: 10px;
        }

        .message {
            margin: 5px 0;
            padding: 8px;
            border-radius: 5px;
            background-color: #f0f0f0;
        }

        .input-container {
            display: flex;
            gap: 10px;
        }

        #message {
            flex-grow: 1;
            padding: 8px;
        }

        button {
            padding: 8px 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>
    <div class="chat-container">
        <h1>채팅방</h1>
        <div class="chat-messages" id="chatMessages"></div>
        <div class="input-container">
            <input type="text" id="message" placeholder="메시지를 입력하세요...">
            <button onclick="sendMessage()">전송</button>
        </div>
    </div>

    <script>
        // WebSocket endpoint (서버에 맞게 수정)
        const socketUrl = 'ws://localhost:18080/chat/connect';
        const roomId = '93e7c7ac-7648-4230-b896-cc207689f09d';
        const username = 'User' + Math.floor(Math.random() * 1000);

        // STOMP 클라이언트 생성
        const client = new StompJs.Client({
            brokerURL: socketUrl,
            connectHeaders: {
                login: "guest",
                passcode: "guest"
            },
            debug: function (str) {
                console.log('STOMP DEBUG:', str);
            },
            reconnectDelay: 5000,
            onConnect: function (frame) {
                console.log('Connected:', frame);

                // 구독
                client.subscribe('/chat/rooms/' + roomId, function (message) {
                    const receivedMessage = JSON.parse(message.body);
                    displayMessage(receivedMessage);
                });
            },
            onStompError: function (frame) {
                console.error('STOMP 오류:', frame.headers['message']);
                console.error('상세:', frame.body);
            }
        });

        // 메시지 표시 함수
        function displayMessage(message) {
            const chatMessages = document.getElementById('chatMessages');
            const messageElement = document.createElement('div');
            messageElement.className = 'message';
            messageElement.textContent = `${message.sender.username || 'Unknown'}: ${message.content.text || message}`;
            chatMessages.appendChild(messageElement);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // 메시지 전송 함수
        function sendMessage() {
            const messageInput = document.getElementById('message');
            const contentText = messageInput.value.trim();

            if (contentText && client && client.connected) {
                const message = {
                    roomId: roomId,
                    content: {
                        text: contentText,
                    }
                };

                client.publish({
                    destination: '/chat',
                    body: JSON.stringify(message)
                });

                messageInput.value = '';
                console.log('📤 메시지 전송됨');
            } else if (!client.connected) {
                console.warn('❗ 클라이언트가 아직 연결되지 않았습니다.');
            }
        }

        // Enter 키로 메시지 전송
        document.getElementById('message').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // 연결 시작
        client.activate();
    </script>
</body>

</html>
