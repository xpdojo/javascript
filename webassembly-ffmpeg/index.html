<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>동영상 압축 도구</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>🎬 동영상 압축</h1>
    <p class="subtitle">ffmpeg.wasm을 사용한 브라우저 기반 동영상 압축</p>

    <div class="upload-area" id="uploadArea">
      <div class="upload-icon">📁</div>
      <div class="upload-text">동영상 파일을 선택하거나 드래그하세요</div>
      <div class="upload-hint">MP4, MOV, AVI 등 지원</div>
      <input type="file" id="fileInput" accept="video/*">
    </div>

    <div class="file-info" id="fileInfo">
      <div class="file-info-item">
        <span class="file-info-label">파일명:</span>
        <span id="fileName">-</span>
      </div>
      <div class="file-info-item">
        <span class="file-info-label">파일 크기:</span>
        <span id="fileSize">-</span>
      </div>
    </div>

    <div class="controls">
      <div class="control-group">
        <label class="control-label">압축 품질 (CRF 값)</label>
        <div class="slider-container">
          <input type="range" id="qualitySlider" class="slider" min="18" max="32" value="28" step="1">
          <span class="slider-value" id="qualityValue">28</span>
        </div>
        <div style="display: flex; justify-content: space-between; font-size: 12px; color: #999; margin-top: 5px;">
          <span>고품질 (작은 파일)</span>
          <span>저품질 (작은 파일)</span>
        </div>
      </div>
    </div>

    <button class="button button-primary" id="compressBtn" disabled>
      압축 시작
    </button>

    <button class="button button-secondary" id="downloadBtn" disabled style="display: none;">
      압축된 파일 다운로드
    </button>

    <div class="progress-container" id="progressContainer">
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill">0%</div>
      </div>
      <div class="progress-text" id="progressText">초기화 중...</div>
    </div>

    <div class="status" id="status"></div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
