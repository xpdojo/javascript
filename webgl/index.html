<!DOCTYPE html>
<html>

<body>
  <canvas id="glCanvas" width="640" height="480"></canvas>
  <script>
    const canvas = document.querySelector("#glCanvas");
    const gl = canvas.getContext("webgl");
    // WebGLRenderingContext
    console.log(gl);

    if (!gl) {
      alert("WebGL을 지원하지 않는 브라우저입니다.");
    }

    // 1. Vertex Shader: 점의 위치 정의
    const vsSource = `
      attribute vec4 aVertexPosition;
      void main() {
        gl_Position = aVertexPosition;
      }
    `;

    // 2. Fragment Shader: 색상 정의 (분홍색)
    const fsSource = `
      void main() {
        gl_FragColor = vec4(1.0, 0.0, 1.0, 1.0);
      }
    `;

    // 셰이더 컴파일 함수 (복잡해 보이지만 표준적인 절차입니다)
    function loadShader(gl, type, source) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      return shader;
    }

    const vertexShader = loadShader(gl, gl.VERTEX_SHADER, vsSource);
    const fragmentShader = loadShader(gl, gl.FRAGMENT_SHADER, fsSource);

    // 프로그램 생성 및 링크
    const shaderProgram = gl.createProgram();
    gl.attachShader(shaderProgram, vertexShader);
    gl.attachShader(shaderProgram, fragmentShader);
    gl.linkProgram(shaderProgram);
    gl.useProgram(shaderProgram);

    // 3. 삼각형 데이터 설정 (x, y 좌표)
    const vertices = new Float32Array([
      0.0, 0.5,
      -0.5, -0.5,
      0.5, -0.5,
    ]);

    const buffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
    gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);

    // GPU에 데이터 전달
    const pos = gl.getAttribLocation(shaderProgram, 'aVertexPosition');
    gl.enableVertexAttribArray(pos);
    gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);

    // 4. 그리기
    gl.clearColor(0.0, 0.0, 0.0, 1.0); // 배경 검정색
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  </script>
</body>

</html>
