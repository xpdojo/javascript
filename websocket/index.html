<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Handshake 모니터링</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>🔌 WebSocket Handshake 모니터링</h1>
        
        <div class="info-box">
            <h3>📋 사용 방법</h3>
            <ul>
                <li>브라우저 개발자 도구(F12)를 열고 <strong>Console</strong> 탭을 확인하세요</li>
                <li><strong>Network</strong> 탭에서 WebSocket 연결을 선택하면 Handshake 요청/응답 헤더를 볼 수 있습니다</li>
                <li>아래 URL을 입력하고 연결 버튼을 클릭하세요</li>
            </ul>
        </div>

        <div class="controls">
            <input 
                type="text" 
                id="wsUrl" 
                placeholder="WebSocket 서버 URL (예: wss://echo.websocket.org 또는 ws://localhost:8080)"
                value="wss://echo.websocket.org"
            >
            <button class="btn-connect" id="connectBtn">연결</button>
            <button class="btn-disconnect" id="disconnectBtn" disabled>연결 해제</button>
            <button class="btn-clear" id="clearBtn">콘솔 지우기</button>
        </div>

        <div id="status" class="status disconnected">
            상태: 연결 안 됨 (CLOSED)
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
